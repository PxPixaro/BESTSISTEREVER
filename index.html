<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Best Sister</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;background:#170010;text-align:center}
    body{background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.16),transparent 11%),radial-gradient(circle at 50% 40%,rgba(255,25,105,.45),transparent 32%),linear-gradient(135deg,#140014,#530020 48%,#08000b)}
    .backlight{position:fixed;inset:-20vmax;pointer-events:none;opacity:.65;background:conic-gradient(from 0deg at 50% 50%,transparent 0 12deg,rgba(255,255,255,.15) 18deg,transparent 35deg,transparent 70deg,rgba(255,70,140,.17) 84deg,transparent 105deg,transparent 150deg,rgba(255,255,255,.12) 165deg,transparent 190deg,transparent 245deg,rgba(255,70,140,.15) 260deg,transparent 290deg,transparent 325deg,rgba(255,255,255,.12) 340deg,transparent 360deg);filter:blur(13px);animation:rays 22s linear infinite}@keyframes rays{to{transform:rotate(360deg)}}
    .screen{position:fixed;inset:0;display:none;place-items:center;padding:18px;z-index:2}.screen.active{display:grid}.wrap{width:min(94vw,900px);position:relative;z-index:3;display:grid;place-items:center;justify-items:center}.title{font-size:clamp(38px,7vw,76px);font-weight:900;letter-spacing:2px;text-transform:uppercase;margin:0 0 22px;text-shadow:0 0 22px #ff5a9e,0 0 50px #ff0058}.sub{font-size:clamp(18px,3vw,30px);color:#ffd6e5;text-shadow:0 0 16px #ff3a85}
    .touch-title{width:min(78vw,520px);max-height:58vh;object-fit:contain;cursor:pointer;filter:drop-shadow(0 0 35px rgba(255,255,255,.55)) drop-shadow(0 0 85px rgba(255,0,100,.85));animation:breath 2.8s ease-in-out infinite}.main-heart{width:min(54vw,330px);max-height:38vh;margin:10px auto 8px;object-fit:contain;cursor:pointer;filter:drop-shadow(0 0 32px rgba(255,40,100,.95)) drop-shadow(0 0 80px rgba(255,0,90,.75));animation:breath 2.6s ease-in-out infinite}.splash-note{font-size:clamp(18px,3vw,28px);margin-top:16px;color:#ffdce8;text-shadow:0 0 18px #ff2d80}.tap{margin-top:18px;font-size:clamp(17px,2.8vw,24px);animation:blink 1.5s infinite}@keyframes breath{50%{transform:scale(1.07)}}@keyframes blink{50%{opacity:.45}}
    .poem{margin:16px auto 0;max-width:720px;line-height:1.6;font-size:clamp(15px,2.1vw,22px);padding:15px 18px;border:1px solid rgba(255,255,255,.22);border-radius:20px;background:rgba(255,255,255,.08);backdrop-filter:blur(9px);box-shadow:0 0 35px rgba(255,0,100,.2)}
    .image-card{width:min(76vw,470px);height:min(76vw,470px);border-radius:30px;overflow:hidden;background:#fff;border:6px solid rgba(255,255,255,.9);box-shadow:0 0 65px rgba(255,255,255,.4),0 0 95px rgba(255,0,90,.8);animation:photoIn .7s ease both;margin:0 auto;display:block;justify-self:center;align-self:center}.image-card img{width:100%;height:100%;object-fit:cover}@keyframes photoIn{from{transform:scale(.25) rotate(-9deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    .video-stage{width:min(96vw,1050px)}.video-title{font-size:clamp(28px,5vw,58px);font-weight:900;margin-bottom:22px;text-shadow:0 0 25px #ff5a9e}.video-grid{display:grid;grid-template-columns:repeat(2,minmax(145px,1fr));gap:clamp(12px,2.5vw,28px);align-items:center}.vframe{height:clamp(160px,30vw,300px);border:5px solid rgba(255,255,255,.88);border-radius:28px;overflow:hidden;background:#000;box-shadow:0 0 42px rgba(255,0,100,.55);transform:rotate(var(--r)) translateY(var(--y));animation:vpop .8s ease both}.vframe video{width:100%;height:100%;object-fit:cover}.vframe:nth-child(1){--r:-4deg;--y:-14px}.vframe:nth-child(2){--r:3deg;--y:18px}.vframe:nth-child(3){--r:2deg;--y:-6px}.vframe:nth-child(4){--r:-3deg;--y:14px}@keyframes vpop{from{transform:scale(.6) rotate(0);opacity:0}to{opacity:1}}
    .blast-piece{position:fixed;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 16px var(--c);z-index:20;pointer-events:none;animation:blast 1.25s ease-out forwards}@keyframes blast{to{transform:translate(var(--x),var(--y)) scale(.18);opacity:0}}
    .petal{position:fixed;top:-60px;width:22px;height:15px;border-radius:80% 20% 80% 20%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.45),transparent 35%),linear-gradient(135deg,#ff9db8,#c50045);z-index:30;pointer-events:none;animation:fall var(--d) linear forwards;opacity:var(--o)}@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r));opacity:0}}
    .final-box{display:grid;place-items:center;gap:18px}.final-text{font-size:clamp(30px,6vw,76px);font-weight:900;color:#ffe7f0;text-shadow:0 0 18px #fff,0 0 42px #ff2d80}.final-images{position:relative;width:min(86vw,560px);height:min(70vh,430px);display:grid;place-items:center}.final-img{position:absolute;max-width:70%;max-height:80%;object-fit:contain;filter:drop-shadow(0 0 28px rgba(255,255,255,.75)) drop-shadow(0 0 70px rgba(255,0,100,.9));animation:zoomFlower 4.8s ease forwards}.final-heart{max-width:48%;animation-delay:.5s}.final-title{animation-delay:0s}@keyframes zoomFlower{0%{transform:scale(.1) rotate(-18deg);opacity:0}25%{transform:scale(1.05) rotate(0);opacity:1}60%{transform:scale(1.18)}100%{transform:scale(.16) rotate(720deg);opacity:.95;border-radius:50%;filter:drop-shadow(0 0 38px #ff7cad)}}
    .flower{position:absolute;width:230px;height:230px;animation:flowerIn 1.5s ease both 4.6s}.flower span{position:absolute;left:95px;top:18px;width:42px;height:98px;border-radius:50% 50% 8px 8px;background:linear-gradient(#ffb3cb,#ff2c78);transform-origin:50% 96px;box-shadow:0 0 22px rgba(255,80,140,.8)}.flower span:nth-child(1){transform:rotate(0deg)}.flower span:nth-child(2){transform:rotate(45deg)}.flower span:nth-child(3){transform:rotate(90deg)}.flower span:nth-child(4){transform:rotate(135deg)}.flower span:nth-child(5){transform:rotate(180deg)}.flower span:nth-child(6){transform:rotate(225deg)}.flower span:nth-child(7){transform:rotate(270deg)}.flower span:nth-child(8){transform:rotate(315deg)}.flower:after{content:'❤';position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:#fff;text-shadow:0 0 20px #ff0058}@keyframes flowerIn{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
  <audio id="song" src="audio/song.mp3" preload="auto" loop></audio><div class="backlight"></div>
  <section class="screen active" id="splash"><div class="wrap"><img id="splashTitle" class="touch-title" alt="TITLE"><div class="splash-note">Touch to start ❤️</div></div></section>
  <section class="screen" id="intro"><div class="wrap"><h1 class="title">WORLD BEST<br>SISTER</h1><img id="mainHeart" class="main-heart" alt="heart touch"><div class="tap">❤️ दिल पर टच करो ❤️</div><div class="poem">लक्ष्मी, तेरी मुस्कान मेरी दुनिया की रोशनी है,<br>तेरी खुशियों में ही मेरी हर खुशी है।<br>तू सिर्फ बहन नहीं, मेरी सबसे प्यारी दोस्त है — Best Sister Ever ❤️</div><div class="sub">Goodbye Sister... I will miss you 🥺</div></div></section>
  <section class="screen" id="images"><div class="wrap"><h1 class="title">LAXMI</h1><div class="image-card"><img id="photo" alt="memory"></div></div></section>
  <section class="screen" id="videos"><div class="video-stage"><div class="video-title" id="videoTitle">Memories Video</div><div class="video-grid" id="videoGrid"></div></div></section>
  <section class="screen" id="final"><div class="final-box"><div class="final-text">Best Sister Ever ❤️</div><div class="final-images"><img id="finalTitle" class="final-img final-title" alt="title"><img id="finalHeart" class="final-img final-heart" alt="heart"><div class="flower"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div></section>
<script>
const imgCount=15, videoCount=8;
const imageNames=Array.from({length:imgCount},(_,i)=>`image${i+1}.jpeg`);
const videoNames=Array.from({length:videoCount},(_,i)=>`video${i+1}.MP4`);
const folders=['asset/','assets/','asset/images/','assets/images/','images/',''];
function firstPath(name){return folders[0]+name}
function withFallback(el,name){let i=0;el.src=folders[i]+name;el.onerror=()=>{i++; if(i<folders.length) el.src=folders[i]+name;};}
const song=document.getElementById('song');
withFallback(document.getElementById('splashTitle'),'TITLE.PNG');
withFallback(document.getElementById('mainHeart'),'heart.png');
withFallback(document.getElementById('finalTitle'),'TITLE.PNG');
withFallback(document.getElementById('finalHeart'),'heart.png');
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function petals(n=80){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='petal';p.style.left=Math.random()*100+'vw';p.style.setProperty('--x',(Math.random()*260-130)+'px');p.style.setProperty('--r',(Math.random()*900-450)+'deg');p.style.setProperty('--d',(4+Math.random()*4)+'s');p.style.setProperty('--o',(.55+Math.random()*.45));document.body.appendChild(p);setTimeout(()=>p.remove(),8500)}}
function blast(n=90){const colors=['#fff','#ff2d78','#ff8ab1','#ffd6e5'];for(let i=0;i<n;i++){const b=document.createElement('div');b.className='blast-piece';b.style.setProperty('--c',colors[i%colors.length]);b.style.setProperty('--x',(Math.random()*1200-600)+'px');b.style.setProperty('--y',(Math.random()*800-400)+'px');document.body.appendChild(b);setTimeout(()=>b.remove(),1400)}}
function startImages(){show('images');song.play().catch(()=>{});let idx=0;const photo=document.getElementById('photo');const next=()=>{withFallback(photo,imageNames[idx]);photo.parentElement.style.animation='none';void photo.parentElement.offsetWidth;photo.parentElement.style.animation='photoIn .7s ease both';idx++; if(idx<imgCount)setTimeout(next,1900);else setTimeout(()=>startVideos(0),2100)};next()}
function startVideos(group){show('videos');document.getElementById('videoTitle').textContent=group===0?'Video Memories 1':'Video Memories 2';const grid=document.getElementById('videoGrid');grid.innerHTML='';let ended=0;for(let i=0;i<4;i++){const index=group*4+i;const frame=document.createElement('div');frame.className='vframe';const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.controls=false;v.preload='auto';let f=0;v.src=folders[f]+videoNames[index];v.onerror=()=>{f++;if(f<folders.length)v.src=folders[f]+videoNames[index]};v.onended=()=>{ended++; if(ended===4){blast();petals(90);setTimeout(()=> group===0 ? startVideos(1) : startFinal(),1800)}};frame.appendChild(v);grid.appendChild(frame);v.play().catch(()=>{});setTimeout(()=>{if(!v.ended){try{v.play()}catch(e){}}},700)}
}
function startFinal(){show('final');blast(120);petals(140);setInterval(()=>petals(25),2600)}
function openIntro(){show('intro');song.play().catch(()=>{});}
document.getElementById('splashTitle').addEventListener('click',openIntro);document.getElementById('splashTitle').addEventListener('touchstart',openIntro,{once:true});
document.getElementById('mainHeart').addEventListener('click',startImages);document.getElementById('mainHeart').addEventListener('touchstart',startImages,{once:true});
</script>
</body>
</html>
